{% set name = "rjieba" %}
{% set version = "0.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: af96d4a14f24b68e053024ab993ec008c868d85598f8af928f2424ff4d86bc44

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation


requirements:
  build:
    - cargo-bundle-licenses
    - {{ compiler("c") }}
    - {{ stdlib("c") }}
    - {{ compiler("rust") }}
  host:
    - python
    - pip
    - maturin >=1,<2
  run:
    - python

test:
  imports:
    - rjieba

about:
  home: https://github.com/messense/rjieba-py
  license: MIT
  license_file:
    - THIRDPARTY.yml
    - LICENSE
  summary: jieba-rs Python binding
  description: |
    rjieba is a fast Chinese text segmentation library based on Rust and jieba.
    It is a Python binding of the Rust version of jieba, which is a popular Chinese text segmentation library.
    It is designed to be fast and efficient, making it suitable for large-scale text processing tasks.
extra:
  recipe-maintainers:
    - ggabernet
